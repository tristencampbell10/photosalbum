<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos Album</title>
    <meta name="description" content="A 3x3 photo grid album displaying nine equal dimension photos with titles." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        padding: 24px 16px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      p.subtitle {
        font-size: 14px;
        color: #64748b;
      }
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 16px;
        width: 100%;
      }
      .photo-card {
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
      }
      .image-wrapper {
        position: relative;
        width: 100%;
        padding-top: 100%; /* 1:1 Aspect Ratio (equal dimensions) */
        overflow: hidden;
        background-color: #f1f5f9;
      }
      .image-wrapper img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .title-wrapper {
        padding: 12px 14px;
        background-color: #ffffff;
      }
      .photo-title {
        font-size: 14px;
        font-weight: 600;
        color: #0f172a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (max-width: 640px) {
        .photo-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
        }
        .title-wrapper {
          padding: 8px 10px;
        }
        .photo-title {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="container">
        <header>
          <h1>Photo Album</h1>
          <p class="subtitle">3 &times; 3 Photo Grid</p>
        </header>

        <main class="photo-grid">
          <!-- ROW 1: AMERICAN FOOTBALL -->
          <!-- Photo 1 -->
          <article class="photo-card" id="photo-card-1">
            <div class="image-wrapper">
              <img src="https://images.unsplash.com/photo-1566577739112-5180d4bf9390?auto=format&fit=crop&w=600&h=600&q=80" alt="American Football Helmet on the Turf" loading="lazy" />
            </div>
            <div class="title-wrapper">
              <h2 class="photo-title">Gridiron Helmet</h2>
            </div>
          </article>

          <!-- Photo 2 -->
          <article class="photo-card" id="photo-card-2">
            <div class="image-wrapper">
              <img src="/images/slaughter-vs-vt.jpg" alt="Slaughter vs VT Game Action" loading="lazy" />
            </div>
            <div class="title-wrapper">
              <h2 class="photo-title">Slaughter vs. VT</h2>
            </div>
          </article>

          <!-- Photo 3 -->
          <article class="photo-card" id="photo-card-3">
            <div class="image-wrapper">
              <img src="https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=600&h=600&q=80" alt="American Football Stadium Under Friday Night Lights" loading="lazy" />
            </div>
            <div class="title-wrapper">
              <h2 class="photo-title">Friday Night Stadium</h2>
            </div>
          </article>

          <!-- ROW 2: VIDEO GAMES -->
          <!-- Photo 4 -->
          <article class="photo-card" id="photo-card-4">
            <div class="image-wrapper">
              <img src="https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?auto=format&fit=crop&w=600&h=600&q=80" alt="Gaming Controller" loading="lazy" />
            </div>
            <div class="title-wrapper">
              <h2 class="photo-title">Next-Gen Controller</h2>
            </div>
          </article>

          <!-- Photo 5 -->
          <article class="photo-card" id="photo-card-5">
            <div class="image-wrapper">
              <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&h=600&q=80" alt="Neon Esports Gaming Rig" loading="lazy" />
            </div>
            <div class="title-wrapper">
              <h2 class="photo-title">Esports Battlestation</h2>
            </div>
          </article>

          <!-- Photo 6 -->
          <article class="photo-card" id="photo-card-6">
            <div class="image-wrapper">
              <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&h=600&q=80" alt="Retro Arcade Setup" loading="lazy" />
            </div>
            <div class="title-wrapper">
              <h2 class="photo-title">Retro Arcade Zone</h2>
            </div>
          </article>

          <!-- ROW 3: BOXING -->
          <!-- Photo 7 -->
          <article class="photo-card" id="photo-card-7">
            <div class="image-wrapper">
              <img src="https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?auto=format&fit=crop&w=600&h=600&q=80" alt="Leather Boxing Gloves" loading="lazy" />
            </div>
            <div class="title-wrapper">
              <h2 class="photo-title">Leather Boxing Gloves</h2>
            </div>
          </article>

          <!-- Photo 8 -->
          <article class="photo-card" id="photo-card-8">
            <div class="image-wrapper">
              <img src="https://images.unsplash.com/photo-1517438322307-e67111335449?auto=format&fit=crop&w=600&h=600&q=80" alt="Heavy Bag Boxing Training" loading="lazy" />
            </div>
            <div class="title-wrapper">
              <h2 class="photo-title">Heavy Bag Workout</h2>
            </div>
          </article>

          <!-- Photo 9 -->
          <article class="photo-card" id="photo-card-9">
            <div class="image-wrapper">
              <img src="https://images.unsplash.com/photo-1509563400280-50589417855b?auto=format&fit=crop&w=600&h=600&q=80" alt="Boxing Ring Under the Lights" loading="lazy" />
            </div>
            <div class="title-wrapper">
              <h2 class="photo-title">Championship Ring</h2>
            </div>
          </article>
        </main>
      </div>
    </div>
  </body>
</html>
