<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos Album</title>
    <meta name="description" content="A 3x3 photo grid album displaying nine equal dimension photos with titles." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0b0f19;
        color: #f1f5f9;
        padding: 32px 16px 48px;
        min-height: 100vh;
        position: relative;
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.35) 0%, transparent 60%),
          radial-gradient(circle at 10% 80%, rgba(15, 23, 42, 0.8) 0%, transparent 50%),
          radial-gradient(circle at 90% 70%, rgba(30, 64, 175, 0.15) 0%, transparent 45%),
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
        background-attachment: fixed;
      }
      .container {
        max-width: 940px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      header {
        text-align: center;
        margin-bottom: 28px;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-bottom: 8px;
        color: #ffffff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      p.subtitle {
        font-size: 14px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 18px;
        width: 100%;
      }
      .photo-card {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        cursor: pointer;
        user-select: none;
      }
      .photo-card:hover {
        transform: translateY(-4px);
        border-color: rgba(96, 165, 250, 0.4);
        box-shadow: 0 16px 32px -6px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.15);
      }
      .image-wrapper {
        position: relative;
        width: 100%;
        padding-top: 100%; /* 1:1 Aspect Ratio (equal dimensions) */
        overflow: hidden;
        background-color: #0f172a;
      }
      .image-wrapper img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.35s ease;
      }
      .photo-card:hover .image-wrapper img {
        transform: scale(1.04);
      }
      .title-wrapper {
        padding: 13px 15px;
        background-color: rgba(15, 23, 42, 0.95);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .photo-title {
        font-size: 14px;
        font-weight: 600;
        color: #f1f5f9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }
      @media (max-width: 640px) {
        body {
          padding: 20px 12px 32px;
        }
        .photo-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
        }
        .title-wrapper {
          padding: 8px 10px;
        }
        .photo-title {
          font-size: 12px;
        }
      }

      /* Floating Football Items Animation in the Background */
      .bg-football-decor {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }
      .floating-item {
        position: absolute;
        opacity: 0.22;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7));
        animation: floatItem linear infinite alternate;
      }

      @keyframes floatItem {
        0% {
          transform: translateY(0) rotate(0deg) scale(0.95);
        }
        50% {
          transform: translateY(-28px) rotate(14deg) scale(1.05);
        }
        100% {
          transform: translateY(-56px) rotate(-10deg) scale(1);
        }
      }

      @keyframes tumbleItem {
        0% {
          transform: translateY(0) rotate(0deg);
        }
        100% {
          transform: translateY(-45px) rotate(360deg);
        }
      }

      .f-1 { top: 6%; left: 3%; animation-duration: 9s; width: 72px; height: 72px; }
      .f-2 { top: 22%; right: 4%; animation-duration: 11s; width: 88px; height: 88px; animation-direction: alternate-reverse; }
      .f-3 { bottom: 12%; left: 5%; animation-duration: 13s; width: 84px; height: 84px; }
      .f-4 { bottom: 18%; right: 6%; animation-duration: 10s; width: 80px; height: 80px; animation-direction: alternate-reverse; }
      .f-5 { top: 48%; left: 2%; animation: tumbleItem 18s linear infinite; width: 68px; height: 68px; opacity: 0.16; }
      .f-6 { top: 52%; right: 3%; animation-duration: 14s; width: 92px; height: 92px; }
      .f-7 { top: 10%; left: 45%; animation-duration: 8s; width: 60px; height: 60px; opacity: 0.14; }
      .f-8 { bottom: 4%; left: 42%; animation-duration: 12s; width: 76px; height: 76px; opacity: 0.18; }

      /* Modal Backdrop & Dialog */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(4, 7, 15, 0.82);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      .modal-backdrop.open {
        opacity: 1;
        visibility: visible;
      }
      .modal-content {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 35px rgba(59, 130, 246, 0.2);
        border-radius: 20px;
        max-width: 580px;
        width: 100%;
        overflow: hidden;
        transform: scale(0.92) translateY(12px);
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .modal-backdrop.open .modal-content {
        transform: scale(1) translateY(0);
      }
      .modal-close-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #f1f5f9;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        transition: background 0.2s, transform 0.2s;
      }
      .modal-close-btn:hover {
        background: rgba(239, 68, 68, 0.85);
        border-color: rgba(239, 68, 68, 1);
        transform: scale(1.08);
      }
      .modal-img-wrapper {
        width: 100%;
        max-height: 340px;
        overflow: hidden;
        background: #020617;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-img-wrapper img {
        width: 100%;
        height: 100%;
        max-height: 340px;
        object-fit: cover;
      }
      .modal-body {
        padding: 22px 24px 26px;
      }
      .modal-category {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #60a5fa;
        background: rgba(37, 99, 235, 0.16);
        border: 1px solid rgba(96, 165, 250, 0.28);
        padding: 4px 10px;
        border-radius: 9999px;
        margin-bottom: 10px;
      }
      .modal-title {
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }
      .modal-desc {
        font-size: 15px;
        line-height: 1.65;
        color: #cbd5e1;
        margin: 0;
      }
      .click-hint {
        display: inline-block;
        font-size: 12px;
        color: #60a5fa;
        margin-top: 6px;
        font-weight: 500;
      }
    </style>
  </head>

    <!-- Description Modal Popup -->
    <div id="photo-modal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-content" id="modal-content">
        <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Close photo description">&times;</button>
        <div class="modal-img-wrapper">
          <img id="modal-img" src="" alt="Selected photo preview" />
        </div>
        <div class="modal-body">
          <span class="modal-category" id="modal-category">Game Detail</span>

    <script>
      (function() {
        const modal = document.getElementById('photo-modal');
        const modalImg = document.getElementById('modal-img');
        const modalTitle = document.getElementById('modal-title');
        const modalCategory = document.getElementById('modal-category');
        const modalDesc = document.getElementById('modal-desc');
        const closeBtn = document.getElementById('modal-close-btn');
        const cards = document.querySelectorAll('.photo-card');

        function openModal(card) {
          const img = card.querySelector('img');
          const title = card.getAttribute('data-title') || card.querySelector('.photo-title').textContent;
          const category = card.getAttribute('data-category') || 'Football Highlight';
          const desc = card.getAttribute('data-desc') || 'Exciting football game day photo.';

          if (img) {
            modalImg.src = img.src;
            modalImg.alt = img.alt || title;
          }
          modalTitle.textContent = title;
          modalCategory.textContent = category;
          modalDesc.textContent = desc;

          modal.classList.add('open');
          modal.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
        }

        function closeModal() {
          modal.classList.remove('open');
          modal.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
        }

        cards.forEach(card => {
          card.addEventListener('click', () => openModal(card));
          card.setAttribute('tabindex', '0');
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', `View details for ${card.getAttribute('data-title') || 'photo'}`);
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openModal(card);
            }
          });
        });

        closeBtn.addEventListener('click', closeModal);

        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            closeModal();
          }
        });

        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && modal.classList.contains('open')) {
            closeModal();
          }
        });
      })();
    </script>
  </body>
</html>
